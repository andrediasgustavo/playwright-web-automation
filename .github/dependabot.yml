version: 2
updates:
  # Version updates are disabled (open-pull-requests-limit: 0), so no automatic
  # bump PRs are opened. Raise the limit to re-enable. Security updates are not
  # affected by this option — Dependabot alerts keep working.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
