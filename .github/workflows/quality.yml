name: Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (valida lockfile via npm ci)
        run: npm ci
      - name: Quality gates (anti-padrões de teste, naming, configs)
        run: npm run gates
      - name: Type check (tsc --noEmit)
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - name: actionlint (lint dos workflows)
        uses: reviewdog/action-actionlint@v1

  secret-scanning:
    name: Secret scanning (gitleaks)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
