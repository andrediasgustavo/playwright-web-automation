name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, master]

jobs:
  title:
    name: Conventional PR title
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            qa

  commits:
    name: Conventional commit messages
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|qa)(\([a-z0-9._/-]+\))?!?: .+'
          FAIL=0
          while IFS= read -r subject; do
            case "$subject" in
              "Merge "*|"Revert "*|"fixup! "*|"squash! "*) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -Eq "$PATTERN"; then
              echo "::error::Commit fora do padrao Conventional Commits: $subject"
              FAIL=1
            fi
          done < <(git log --format=%s "origin/${BASE_REF}..HEAD")
          exit "$FAIL"
